name: Build Matrix

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package refs to build, for example core/fastfetch
        required: false
        type: string

permissions:
  contents: read
  packages: read

env:
  BUILDER_IMAGE: local/pacman-android-builder
  ANDROID_NDK_VERSION: "29"

jobs:
  detect-packages:
    runs-on: ubuntu-24.04
    outputs:
      has_packages: ${{ steps.detect.outputs.has_packages }}
      has_removals: ${{ steps.detect.outputs.has_removals }}
      builder_changed: ${{ steps.detect.outputs.builder_changed }}
      packages: ${{ steps.detect.outputs.packages }}
      matrix: ${{ steps.detect.outputs.matrix }}
      remove_packages: ${{ steps.detect.outputs.remove_packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Detect changed package directories
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_DISPATCH_PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail

          changed_files="$(mktemp)"
          plan_file="$RUNNER_TEMP/repo-sync-plan.json"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${WORKFLOW_DISPATCH_PACKAGES}" ]]; then
            python3 ./toolchain/ci/detect-packages.py \
              --packages "${WORKFLOW_DISPATCH_PACKAGES}" \
              --github-output "$GITHUB_OUTPUT" \
              --plan-file "$plan_file" \
              --repo-root "$GITHUB_WORKSPACE"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            gh api \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate \
              --jq '.[] | [.status, (.previous_filename // ""), .filename] | @tsv' > "$changed_files"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            gh api \
              "repos/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}" \
              --jq '.files[] | [.status, (.previous_filename // ""), .filename] | @tsv' > "$changed_files"
          else
            git diff-tree --no-commit-id --name-status -r "${GITHUB_SHA}" | awk '
              $1 ~ /^R/ { print "renamed\t" $2 "\t" $3; next }
              $1 == "A" { print "added\t\t" $2; next }
              $1 == "D" { print "removed\t\t" $2; next }
              { print "modified\t\t" $2 }
            ' > "$changed_files"
          fi

          python3 ./toolchain/ci/detect-packages.py \
            --github-output "$GITHUB_OUTPUT" \
            --plan-file "$plan_file" \
            --repo-root "$GITHUB_WORKSPACE" < "$changed_files"

      - name: Upload repository sync plan
        uses: actions/upload-artifact@v7
        with:
          name: repo-sync-plan
          path: ${{ runner.temp }}/repo-sync-plan.json
          if-no-files-found: error

  prepare-builder:
    needs: detect-packages
    runs-on: ubuntu-24.04
    steps:
      - name: Skip builder rebuild
        if: needs.detect-packages.outputs.builder_changed != 'true' || needs.detect-packages.outputs.has_packages != 'true'
        run: echo "No builder image rebuild is needed for this run."

      - name: Checkout
        if: needs.detect-packages.outputs.builder_changed == 'true' && needs.detect-packages.outputs.has_packages == 'true'
        uses: actions/checkout@v7

      - name: Build builder image
        if: needs.detect-packages.outputs.builder_changed == 'true' && needs.detect-packages.outputs.has_packages == 'true'
        run: docker build -f docker/builder.Dockerfile -t "${BUILDER_IMAGE}:${GITHUB_SHA}" .

      - name: Save builder image
        if: needs.detect-packages.outputs.builder_changed == 'true' && needs.detect-packages.outputs.has_packages == 'true'
        run: docker save "${BUILDER_IMAGE}:${GITHUB_SHA}" | gzip -1 > builder-image.tar.gz

      - name: Upload builder image
        if: needs.detect-packages.outputs.builder_changed == 'true' && needs.detect-packages.outputs.has_packages == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: builder-image
          path: builder-image.tar.gz
          if-no-files-found: error

  build-targets:
    needs:
      - detect-packages
      - prepare-builder
    if: needs.detect-packages.outputs.has_packages == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-packages.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download builder image
        if: needs.detect-packages.outputs.builder_changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: builder-image

      - name: Load builder image
        if: needs.detect-packages.outputs.builder_changed == 'true'
        run: gzip -dc builder-image.tar.gz | docker load

      - name: Resolve builder image
        run: |
          if [[ "${{ needs.detect-packages.outputs.builder_changed }}" == "true" ]]; then
            echo "BUILDER_IMAGE_REF=${BUILDER_IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          else
            echo "BUILDER_IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}/builder:main" >> "$GITHUB_ENV"
          fi

      - name: Login to GHCR
        if: needs.detect-packages.outputs.builder_changed != 'true'
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull published builder image
        if: needs.detect-packages.outputs.builder_changed != 'true'
        run: docker pull "${BUILDER_IMAGE_REF}"

      - name: Restore Android NDK cache
        uses: actions/cache@v6
        with:
          path: |
            vendor/android-ndk-r${{ env.ANDROID_NDK_VERSION }}
            vendor/android-ndk-r${{ env.ANDROID_NDK_VERSION }}-linux.zip
          key: ${{ runner.os }}-android-ndk-r${{ env.ANDROID_NDK_VERSION }}

      - name: Build Android package
        run: |
          docker run --rm \
            -e ANDROID_NDK_VERSION="${ANDROID_NDK_VERSION}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            "${BUILDER_IMAGE_REF}" \
            bash ./toolchain/ci/build-target.sh "${{ matrix.package_ref }}" "${{ matrix.target }}"

      - name: Upload target artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.repo }}-${{ matrix.package }}-${{ matrix.target }}
          path: out/packages/${{ matrix.repo }}/${{ matrix.target }}
          if-no-files-found: error

  no-package-changes:
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: No package directories changed
        run: |
          echo "No changed package directories were detected under <repo>-packages/<name>/."
