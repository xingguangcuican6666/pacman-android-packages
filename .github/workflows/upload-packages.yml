name: Upload Packages

on:
  workflow_run:
    workflows:
      - Build Matrix
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_id:
        description: Build Matrix run ID to upload from
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  GH_REPO: ${{ github.repository }}
  PACMAN_REPO_UPLOAD_URL: ${{ secrets.PACMAN_REPO_UPLOAD_URL }}
  PACMAN_REPO_UPLOAD_TOKEN: ${{ secrets.PACMAN_REPO_UPLOAD_TOKEN }}

jobs:
  upload:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-24.04

    steps:
      - name: Validate upload secrets
        id: validate
        run: |
          set -euo pipefail
          if [[ -z "${PACMAN_REPO_UPLOAD_URL}" || -z "${PACMAN_REPO_UPLOAD_TOKEN}" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Upload secrets are missing; skipping upload."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve source run ID
        id: run
        if: steps.validate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            echo "id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate source run branch and status
        id: source
        if: steps.validate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          run_json="$(gh api repos/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }})"
          head_branch="$(printf '%s' "$run_json" | jq -r '.head_branch')"
          conclusion="$(printf '%s' "$run_json" | jq -r '.conclusion')"
          event_name="$(printf '%s' "$run_json" | jq -r '.event')"
          workflow_name="$(printf '%s' "$run_json" | jq -r '.name')"

          echo "head_branch=$head_branch"
          echo "conclusion=$conclusion"
          echo "event=$event_name"
          echo "workflow=$workflow_name"

          if [[ "$workflow_name" != "Build Matrix" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Source run is not a Build Matrix run; skipping upload."
            exit 0
          fi

          if [[ "$head_branch" != "main" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Source run is not from main; skipping upload."
            exit 0
          fi

          if [[ "$conclusion" != "success" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Source run did not succeed; skipping upload."
            exit 0
          fi

          if [[ "$event_name" == "pull_request" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Source run came from pull_request; skipping upload."
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts from source run
        if: steps.validate.outputs.enabled == 'true' && steps.source.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "${{ steps.run.outputs.id }}" -R "${GH_REPO}" -D artifacts

      - name: Upload packages to pacman repository
        if: steps.validate.outputs.enabled == 'true' && steps.source.outputs.allowed == 'true'
        run: |
          set -euo pipefail

          mapfile -d '' packages < <(find artifacts -type f -name '*.pkg.tar.zst' -print0 | sort -z)
          if ((${#packages[@]} == 0)); then
            echo "No package artifacts found in downloaded run artifacts" >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            curl \
              --fail \
              --show-error \
              --location \
              --retry 5 \
              --retry-all-errors \
              -H "X-Upload-Token: ${PACMAN_REPO_UPLOAD_TOKEN}" \
              -F "package=@${package}" \
              "${PACMAN_REPO_UPLOAD_URL}"
          done
